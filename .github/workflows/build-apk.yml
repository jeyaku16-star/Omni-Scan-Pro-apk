name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== JAVA ENVIRONMENT VERIFICATION ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set."
            exit 1
          fi

          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"

          if [ -z "$JAVA_MAJOR" ] || ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "Error: Could not detect active Java major version."
            exit 1
          fi

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version must be 17 or higher. Found: $JAVA_MAJOR"
            exit 1
          fi
          echo "Java verification passed successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== CHECKING DEBUG KEYSTORE ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Keeping existing."
          else
            echo "debug.keystore missing. Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          echo "=== VERIFYING APK ==="
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ -f "$TARGET_APK" ]; then
            if [ ! -s "$TARGET_APK" ]; then
              echo "Error: $TARGET_APK is empty."
              exit 1
            fi
            echo "Target APK exists and is valid: $TARGET_APK ($(stat -c%s "$TARGET_APK") bytes)"
          else
            echo "Error: Expected APK not found at $TARGET_APK"
            echo "Searching only inside app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            fi
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_RELEASE_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "$TEMP_RELEASE_DIR/app-debug.apk"
          
          if [ ! -s "$TEMP_RELEASE_DIR/app-debug.apk" ]; then
            echo "Error: Failed to prepare $TEMP_RELEASE_DIR/app-debug.apk"
            exit 1
          fi
          
          echo "Prepared release asset at: $TEMP_RELEASE_DIR/app-debug.apk"
          echo "asset_path=$TEMP_RELEASE_DIR/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== VALIDATING GITHUB CLI & ASSET ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared APK asset does not exist or is empty at $ASSET_PATH"
            exit 1
          fi

          if [[ "$ASSET_PATH" != *".apk" ]]; then
            echo "Error: Asset does not have .apk extension."
            exit 1
          fi

          FILENAME=$(basename "$ASSET_PATH")
          if [ "$FILENAME" != "app-debug.apk" ]; then
            echo "Error: Release asset filename must be exactly app-debug.apk. Found: $FILENAME"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          echo "Creating release $RELEASE_TAG..."
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "### OmniScan Pro - Automated Debug APK Build

- **Build Source**: Automated build generated by GitHub Actions.
- **Workflow Run**: #${{ github.run_number }}
- **Attempt**: #${{ github.run_attempt }}
- **Commit SHA**: \`${{ github.sha }}\`
- **Notice**: This APK is intended for testing and evaluation purposes.
- **Signing**: Signed exclusively with a temporary Android debug keystore (not a Google Play Store production release)."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== APK DOWNLOAD REPORT ==="
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            gh release view "$RELEASE_TAG" || true
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release Asset: app-debug.apk"
            
            DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "Direct APK URL: $DIRECT_URL"

            echo "### DIRECT APK DOWNLOAD" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "[Download app-debug.apk]($DIRECT_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Permanent link: \`$DIRECT_URL\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "*(Actions artifact \`app-debug-apk\` is also available as a backup)*" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release creation did not complete successfully or was skipped."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The debug APK was built successfully and is preserved as GitHub Actions artifact: app-debug-apk."
            fi
          fi
